name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend — lint, tests, typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        working-directory: back-end
        run: npm ci

      - name: Lint
        working-directory: back-end
        run: npm run lint

      - name: Tests unitaires
        working-directory: back-end
        run: npm test

      - name: Vérification TypeScript
        working-directory: back-end
        run: npm run typecheck

      - name: Audit des dépendances (non bloquant)
        working-directory: back-end
        run: npm audit --audit-level=critical || true

  frontend:
    name: Frontend — lint, tests, typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app-bank/package-lock.json

      - name: Install dependencies
        working-directory: app-bank
        run: npm ci

      - name: Lint
        working-directory: app-bank
        run: npm run lint

      - name: Tests unitaires
        working-directory: app-bank
        run: npm test

      - name: Vérification TypeScript
        working-directory: app-bank
        run: npm run typecheck
